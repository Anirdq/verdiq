<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="A professional trading journal for Forex and Futures traders. Track trades, analyze performance, and improve your trading psychology.">
  <meta name="theme-color" content="#0d1117">
  <link rel="manifest" href="/manifest.json">
  <title>Verdiq — Forex & Futures Trading Journal</title>

  <!-- Error Debugger -->
  <script>
    window.addEventListener('error', e => alert('Error: ' + e.message + ' at line ' + e.lineno));
    window.addEventListener('unhandledrejection', e => alert('Promise Error: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <!-- Styles -->
  <link rel="icon" type="image/png" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">

</head>
<body>

  <div class="app" id="app">
    <!-- Loading state while scripts load -->
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;width:100%;flex-direction:column;gap:1rem">
      <img src="/icon.png" alt="Verdiq" style="width: 64px; height: 64px; border-radius: 12px; margin-bottom: 8px;">
      <div style="color:var(--text-muted);font-size:14px;font-family:var(--font-body)">Loading Verdiq...</div>
    </div>

    <!-- Main Content Area -->
    <main class="main-content" id="main-content">
      <!-- Pages render here -->
    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-nav" id="mobile-nav">
      <a class="mobile-nav-item" data-route="/dashboard" href="#/dashboard">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Home</span>
      </a>
      <a class="mobile-nav-item" data-route="/trades" href="#/trades">
        <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        <span>Log</span>
      </a>
      <a class="mobile-nav-item mobile-nav-primary" data-route="/new-trade" href="#/new-trade">
        <div class="mobile-nav-fab">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>
      </a>
      <a class="mobile-nav-item" data-route="/calculator" href="#/calculator">
        <svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16.01" y2="14"/><line x1="12" y1="14" x2="12.01" y2="14"/><line x1="8" y1="14" x2="8.01" y2="14"/><line x1="16" y1="10" x2="16.01" y2="10"/><line x1="12" y1="10" x2="12.01" y2="10"/><line x1="8" y1="10" x2="8.01" y2="10"/><line x1="16" y1="18" x2="16.01" y2="18"/><line x1="12" y1="18" x2="12.01" y2="18"/><line x1="8" y1="18" x2="8.01" y2="18"/></svg>
        <span>Calc</span>
      </a>
      <a class="mobile-nav-item" data-route="/settings" href="#/settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Setup</span>
      </a>
    </nav>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <!-- Authentication Overlay -->
  <div id="auth-overlay" class="auth-overlay hidden">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo"><img src="/icon.png" alt="Verdiq" style="width: 28px; height: 28px; vertical-align: middle; margin-right: 8px; border-radius: 6px;">Verdiq</div>
        <p class="auth-subtitle">Login to sync your trades securely</p>
      </div>
      
      <!-- Connect Form (URL / Key) -->
      <div id="auth-config-section" class="auth-section">
        <div class="form-group mb-3">
          <label class="form-label">Supabase URL</label>
          <input type="text" class="form-input" id="auth-supabase-url" placeholder="https://xxxx.supabase.co">
        </div>
        <div class="form-group mb-4">
          <label class="form-label">Supabase Anon Key</label>
          <input type="password" class="form-input" id="auth-supabase-key" placeholder="eyJhbGciOiJIUzI1NiIsInR5c...">
        </div>
        <button class="btn btn-primary w-full" id="auth-connect-btn">Connect Database</button>
      </div>

      <!-- Login / Signup Form -->
      <div id="auth-login-section" class="auth-section hidden">
        <div class="form-group mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="auth-email" placeholder="you@example.com">
        </div>
        <div class="form-group mb-4">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="auth-password" placeholder="••••••••">
        </div>
        <div class="flex flex-col gap-2">
          <button class="btn btn-primary w-full" id="auth-login-btn">Log In</button>
          <button class="btn btn-secondary w-full" id="auth-signup-btn">Sign Up</button>
        </div>
        <div class="text-center mt-4">
          <button class="btn btn-ghost btn-sm" id="auth-reconnect-btn">Change Database</button>
        </div>
      </div>
    </div>
  </div>
