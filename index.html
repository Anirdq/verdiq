<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A professional trading journal for Forex and Futures traders. Track trades, analyze performance, and improve your trading psychology.">
  <title>Verdiq — Forex & Futures Trading Journal</title>

  <!-- Error Debugger -->
  <script>
    window.addEventListener('error', e => alert('Error: ' + e.message + ' at line ' + e.lineno));
    window.addEventListener('unhandledrejection', e => alert('Promise Error: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
</head>
<body>

  <div class="app" id="app">
    <!-- Loading state while scripts load -->
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;width:100%;flex-direction:column;gap:1rem">
      <div style="font-size:48px">📈</div>
      <div style="color:var(--text-muted);font-size:14px;font-family:var(--font-body)">Loading Verdiq...</div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <!-- Authentication Overlay -->
  <div id="auth-overlay" class="auth-overlay hidden">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">📈 Verdiq</div>
        <p class="auth-subtitle">Login to sync your trades securely</p>
      </div>
      
      <!-- Connect Form (URL / Key) -->
      <div id="auth-config-section" class="auth-section">
        <div class="form-group mb-3">
          <label class="form-label">Supabase URL</label>
          <input type="text" class="form-input" id="auth-supabase-url" placeholder="https://xxxx.supabase.co">
        </div>
        <div class="form-group mb-4">
          <label class="form-label">Supabase Anon Key</label>
          <input type="password" class="form-input" id="auth-supabase-key" placeholder="eyJhbGciOiJIUzI1NiIsInR5c...">
        </div>
        <button class="btn btn-primary w-full" id="auth-connect-btn">Connect Database</button>
      </div>

      <!-- Login / Signup Form -->
      <div id="auth-login-section" class="auth-section hidden">
        <div class="form-group mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="auth-email" placeholder="you@example.com">
        </div>
        <div class="form-group mb-4">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="auth-password" placeholder="••••••••">
        </div>
        <div class="flex flex-col gap-2">
          <button class="btn btn-primary w-full" id="auth-login-btn">Log In</button>
          <button class="btn btn-secondary w-full" id="auth-signup-btn">Sign Up</button>
        </div>
        <div class="text-center mt-4">
          <button class="btn btn-ghost btn-sm" id="auth-reconnect-btn">Change Database</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <!-- App Modules (order matters) -->
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/trade-form.js"></script>
  <script src="js/trade-list.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/journal.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
